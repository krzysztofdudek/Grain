name: RepositoryFreeOfWeb
description: "A repository must not reach the web layer — not the servlet API, not Spring MVC, and above all not a controller. The dependency runs one way: a controller calls a repository. Reversing it, even once, turns the two into a pair that cannot be tested or reused apart, and makes a slice test that mocks the repository meaningless."
