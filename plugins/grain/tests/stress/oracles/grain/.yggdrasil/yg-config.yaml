version: "5.2.0"

quality:
  # Ownership-sized nodes: a node whose direct fan-out passes ten is doing more than one job.
  max_direct_relations: 10

parallel: 4
debug: false

coverage:
  # Every tracked file is required to be covered: the 32 classifying types partition the whole tree,
  # so an uncovered file means a NEW kind of file arrived that nobody classified — exactly the moment
  # to decide what it is.
  required: ["/"]
  # Nothing is excluded. This oracle graph and its README sit under the corpus directory of the very
  # repository they describe, and they are skipped automatically because that subtree carries its own
  # nested graph — an explicit exclusion for them would be config that does nothing.
  excluded: []
  # A rule binds to a file through its TYPE, with no node of its own. This is what lets the type/rule
  # cut stay fine while nodes stay ownership-sized.
  type_level: true

signals:
  attention: true

reviewer:
  tiers:
    standard:
      # A local, keyless reviewer, matching this repository's own promise that nothing leaves the
      # machine. Only the tier NAME is folded into a verdict hash, so a maintainer may point `standard`
      # at their own reviewer through a gitignored yg-secrets.yaml without invalidating a baseline.
      provider: claude-code
      consensus: 1
      # Deliberately far above the 50 000 default. The mining core is a 572 KB single file, and a prose
      # rule about it cannot be verified in a prompt smaller than the file. The number is not a
      # preference: it is what this repository's largest module costs today, and the advisory rule
      # `engine/file-size-budget` is the standing request to bring it back under the DEFAULT budget so
      # this line can go away.
      max_prompt_chars: 600000
      config:
        model: sonnet
        temperature: 0
