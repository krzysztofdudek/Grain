name: HookVerbExists
description: >-
  Every hook configuration must be valid JSON, every command it wires must invoke the plugin's CLI entry
  point, and every verb it names must be one the dispatcher actually handles.

  A hook is the one surface with no user in front of it. Nobody types it, nobody reads its output on
  purpose, and a broken one does not announce itself — the host runs the command, the command fails, the
  host swallows it, and the only symptom is that the tool has quietly stopped speaking. That is
  indistinguishable from the tool correctly having nothing to say, which is a normal and frequent
  outcome here, so the failure can persist indefinitely.

  The four configurations deliberately differ from one another: hosts offer different events, so one
  wires six moments and another wires one. Coverage is NOT compared between them. What is compared is
  that each verb any of them names exists, and that each command goes through the entry point rather
  than an engine module.
errs: under
status: enforced
