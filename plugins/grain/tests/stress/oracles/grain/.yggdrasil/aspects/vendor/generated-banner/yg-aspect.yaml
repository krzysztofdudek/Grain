name: GeneratedBanner
description: >-
  Every vendored relation module must open with the generated banner: a first line saying it was
  generated by the regeneration script and must not be edited, and a second naming the upstream source
  it came from and the command that rewrites it.

  These files are mechanically produced from a sibling project's TypeScript — types erased, specifiers
  rewritten, the parts coupled to that project's own model cut away — and then committed so that an
  install needs no build step. That combination is exactly the trap the banner exists for: they look
  like ordinary source, they sit in the same tree as hand-written source, and a fix made here survives
  until the next regeneration and then disappears with nothing in the diff to explain where it went. The
  banner is the only thing standing between a reader and that hour.

  The banner must also name the regeneration command, because "do not edit" without "edit this instead"
  is an instruction nobody can follow.
errs: under
status: enforced
review_by: 2027-06-01
scope:
  per: file
  files:
    path: "**/*.mjs"
