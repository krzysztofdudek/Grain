name: Relation Seam Cases
type: test-relations-unit
description: >-
  The relation cases that stayed when the per-construct catalogue left for Runes: white-box checks of
  Grain's own seam with the vendored extractors, one file per seam — the project scope a C# file is
  resolved in, and the parser a damaged Kotlin file is re-read with. Each goes through Grain's parse and
  relation pass, and the Kotlin one also end to end through the harness.
relations:
  - target: plugin/tests/relations/harness
    type: uses
  - target: plugin/engine/vendor-runes
    type: calls
  - target: plugin/engine/mining
    type: calls
  - target: plugin/engine/relations
    type: calls
mapping:
  - plugins/grain/tests/relations/*.test.mjs
