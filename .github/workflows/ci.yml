# The gate: the full conformance suite (engine + relations + CLI e2e + hooks) on every push and PR.
# Tests need no npm install — the tree-sitter runtime and grammars are vendored; the suite drives the real CLI.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: tests (node ${{ matrix.node }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: git identity for test fixtures
        run: |
          git config --global user.name ci
          git config --global user.email ci@invalid
          git config --global init.defaultBranch main
      - name: run suite
        working-directory: plugins/grain
        run: npm test

  seams:
    # The family's seam contracts (ticket 100): Grain's proposal renderer, run through Yggdrasil's REAL binary
    # and Horde's REAL scripts — never a re-implementation of either. This is where the "compat matrix" named in
    # decision `layers-compatible-no-user-thresholds` starts: each layer keeps its own repo and its own gate,
    # wired together only through the versioned contracts `docs/reference.md`'s "The proposal contract" section
    # documents (`.yggdrasil/` proposal shape, `provenance.json`, `charter.md`, `.family-candidates.json`).
    runs-on: ubuntu-latest
    name: seam tests (Yggdrasil + Horde)
    timeout-minutes: 30
    steps:
      - name: checkout grain
        uses: actions/checkout@v4
        with:
          path: grain
      - name: checkout Yggdrasil
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/Yggdrasil
          path: yggdrasil
      - name: checkout Horde
        uses: actions/checkout@v4
        with:
          repository: krzysztofdudek/Horde
          path: horde
      # The two repositories the in-tree hand oracles under tests/stress/oracles/ describe. Pinned to the exact
      # commits those oracles were written against — the oracle asserts file counts and mappings, so a moving
      # default branch would fail the guard for a reason that has nothing to do with this repository. Without
      # them the oracle tests skip with a reason and the rest of the suite is unaffected.
      - name: checkout the express corpus clone
        uses: actions/checkout@v4
        with:
          repository: expressjs/express
          ref: 023767fe9872e029271df1418f73401bff20ff40
          path: corpus/express
      - name: checkout the spring-petclinic corpus clone
        uses: actions/checkout@v4
        with:
          repository: spring-projects/spring-petclinic
          ref: 818c4136ea971c21674525f9053de0d9c7ad8cfe
          path: corpus/spring-petclinic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: git identity for test fixtures
        run: |
          git config --global user.name ci
          git config --global user.email ci@invalid
          git config --global init.defaultBranch main
      - name: build Yggdrasil's CLI
        working-directory: yggdrasil/source/cli
        run: |
          npm install
          npm run build
      - name: run seam tests
        working-directory: grain/plugins/grain
        env:
          YG_BIN: ${{ github.workspace }}/yggdrasil/source/cli/dist/bin.js
          YGG_DIR: ${{ github.workspace }}/yggdrasil
          HORDE_DIR: ${{ github.workspace }}/horde
        run: node --test tests/seams.test.mjs
      - name: run the reconstruction and advice guards against the hand oracles
        working-directory: grain/plugins/grain
        env:
          GRAIN_CORPUS_CLONES: ${{ github.workspace }}/corpus
        run: node --test tests/reconstruct.test.mjs tests/advise-command.test.mjs
